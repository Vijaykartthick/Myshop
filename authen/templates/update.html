{% extends 'main.html' %}


{% block links %}

<style>

    /* Main update page */

    .update-page {
        min-height: calc(100vh - 70px);

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 50px 20px;

        background: #f4f7fb;
    }


    /* Update Card */

    .update-card {
        width: 100%;
        max-width: 550px;

        background: white;

        padding: 40px;

        border-radius: 20px;

        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
    }


    /* Heading */

    .update-card h1 {
        text-align: center;

        margin-bottom: 35px;

        font-size: 32px;

        color: #222;
    }


    /* Form group */

    .form-group {
        margin-bottom: 22px;
    }


    .form-group label {
        display: block;

        margin-bottom: 8px;

        font-size: 15px;

        font-weight: 600;

        color: #333;
    }


    /* Input */

    .form-group input[type="text"],
    .form-group input[type="email"] {

        width: 100%;

        padding: 14px 16px;

        border: 1px solid #d5d9e0;

        border-radius: 10px;

        font-size: 16px;

        outline: none;

        transition: 0.2s;

        background: #fafbfc;
    }


    .form-group input:focus {

        border-color: #4f46e5;

        background: white;

        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
    }


    /* Profile photo section */

    .profile-photo {

        margin-top: 10px;

        margin-bottom: 30px;

        padding: 20px;

        border: 2px dashed #cbd5e1;

        border-radius: 12px;

        text-align: center;

        background: #f8fafc;
    }


    .profile-photo input[type="file"] {

        width: 100%;

        font-size: 14px;

        cursor: pointer;
    }


    /* Submit button */

    .submit-btn {

        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #4f46e5,
            #2563eb
        );

        color: white;

        font-size: 17px;

        font-weight: 700;

        cursor: pointer;

        transition: 0.2s;
    }


    .submit-btn:hover {

        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(37, 99, 235, 0.25);
    }


    .submit-btn:active {

        transform: translateY(0);
    }


    /* Mobile */

    @media (max-width: 600px) {

        .update-page {
            padding: 25px 15px;
        }

        .update-card {
            padding: 30px 20px;
        }

        .update-card h1 {
            font-size: 27px;
        }

    }

</style>

{% endblock %}


{% block context %}

{% if messages %}
{% for i in messages %}
{{i}}
{% endfor %}
{% endif %}

<div class="update-page">

    <div class="update-card">

        <h1>Update Profile</h1>


        <form action="" method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <!-- Username -->

            <div class="form-group">

                <label>Username :</label>

                <input type="text" name="uname" placeholder="Enter username" required value="{{ request.user.username }}">

            </div>


            <!-- Email -->

            <div class="form-group">

                <label>Email :</label>

                <input type="email" name="email" placeholder="Enter email" required value="{{ request.user.email }}">

            </div>


            <!-- Profile Photo -->

            <div class="profile-photo">

                <label>
                    📷 Choose Profile Photo
                </label>

                <br><br>

                <input type="file" name="pic" accept="image/*">

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="submit-btn"
            >
                UPDATE PROFILE
            </button>

        </form>

    </div>

</div>

{% endblock %}
