{% extends 'main.html' %}

{% block links %}
<style>
    .address-form {
        width: 450px;
        margin: 60px auto;
        padding: 30px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        text-align: left;
    }

    .address-form h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .address-form p {
        margin-bottom: 15px;
    }

    .address-form label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
    }

    .address-form input,
    .address-form textarea,
    .address-form select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    .address-form input:focus,
    .address-form textarea:focus,
    .address-form select:focus {
        border-color: #2874f0;
        box-shadow: 0 0 5px rgba(40, 116, 240, 0.3);
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #2874f0;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #1557b0;
    }

    .select-address {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #2874f0;
        text-decoration: none;
        font-weight: bold;
    }

    .select-address:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block context %}

<div class="address-form">

    <h2>Add Address</h2>

    <form action="" method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="submit-btn">
            Submit
        </button>
    </form>

    <a href="{% url 'address_list' %}" class="select-address">
        Select Your Address
    </a>

</div>

{% endblock %}
