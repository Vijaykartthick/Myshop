{% extends 'main.html' %}

{% block links %}

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f1f3f6;
    }

    .update-address-page {
        min-height: 90vh;
        padding: 50px 20px;
    }
    .address-container {
        width: 600px;
        max-width: 95%;
        margin: auto;
        background: #ffffff;
        padding: 35px 40px;
        border-radius: 6px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
    }

    .address-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .address-title h1 {
        margin: 0;
        font-size: 27px;
        color: #212121;
        font-weight: 600;
    }

    .address-title p {
        margin-top: 8px;
        color: #777;
        font-size: 14px;
    }

    .address-form p {
        margin: 0 0 20px;
    }

    .address-form label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
        color: #333;
    }

    .address-form input,
    .address-form textarea,
    .address-form select {
        width: 100%;
        padding: 13px 14px;
        box-sizing: border-box;

        border: 1px solid #d5d5d5;
        border-radius: 4px;

        background: #fff;

        font-size: 15px;
        color: #333;

        outline: none;

        transition: all 0.25s ease;
    }




    .address-form textarea {
        min-height: 100px;
        resize: vertical;
        font-family: Arial, Helvetica, sans-serif;
    }

    .address-form input:hover,
    .address-form textarea:hover,
    .address-form select:hover {
        border-color: #999;
    }

    .address-form input:focus,
    .address-form textarea:focus,
    .address-form select:focus {
        border-color: #2874f0;

        box-shadow:
            0 0 0 2px rgba(40, 116, 240, 0.12);

        background: #fff;
    }


    .address-form input::placeholder,
    .address-form textarea::placeholder {
        color: #999;
    }


    .address-form .helptext {
        display: block;
        margin-top: 5px;

        color: #888;
        font-size: 12px;
    }


    .address-form .errorlist {
        margin: 5px 0;
        padding: 0;

        list-style: none;

        color: #e53935;
        font-size: 13px;
    }

    .submit-btn {
        width: 100%;

        margin-top: 10px;
        padding: 14px;

        border: none;
        border-radius: 4px;

        background: #2874f0;
        color: white;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        transition: all 0.25s ease;
    }


    .submit-btn:hover {
        background: #1557b0;

        box-shadow:
            0 4px 10px rgba(40, 116, 240, 0.35);

        transform: translateY(-1px);
    }


    .submit-btn:active {
        transform: translateY(0);
        box-shadow: none;
    }


    .back-btn {
        display: block;

        width: fit-content;

        margin: 20px auto 0;

        color: #2874f0;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;
    }

    .back-btn:hover {
        text-decoration: underline;
    }
    .address-form label::after {
        color: #e53935;
    }
    @media (max-width: 700px) {

        .update-address-page {
            padding: 25px 10px;
        }

        .address-container {
            width: 100%;
            padding: 25px 20px;
        }

        .address-title h1 {
            font-size: 23px;
        }

        .address-form input,
        .address-form textarea,
        .address-form select {
            padding: 12px;
        }

        .submit-btn {
            padding: 13px;
        }
    }
    
    @media (max-width: 400px) {

        .address-container {
            padding: 20px 15px;
        }

        .address-title h1 {
            font-size: 21px;
        }

        .address-form label {
            font-size: 13px;
        }

        .address-form input,
        .address-form textarea,
        .address-form select {
            font-size: 14px;
        }
    }

</style>

{% endblock %}

{% block context %}

<div class="update-address-page">

    <div class="address-container">

        <div class="address-title">
            <h1>Update Address</h1>
            <p>Update your delivery address details</p>
        </div>

        <form action="" method="POST" class="address-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-btn">
                Update Address
            </button>

        </form>

        <a href="{% url 'address_list' %}" class="back-btn">
            ← Back to Addresses
        </a>

    </div>

</div>

{% endblock %}
