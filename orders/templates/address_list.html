{% extends 'main.html' %}

{% block context %}


<center>
    {% for i in address %}
    <div>
    <h2>{{i.fullname}}</h2>
    <h2>{{i.mobile}}</h2>
    <h3>{{i.address_line}}</h3>
    <h4>{{i.city}}</h4>
    <h4>{{i.state}}</h4>
    <h5>{{i.pincode}}</h5>
    <h6>{{i.created_at}}</h6>
    <a href="{% url 'update_address' i.id %}">Update</a>
    <a href="{% url 'delete_address' i.id %}">Delete address</a>
    </div><br><br>
    
    {% endfor %}

    
</center>
{% endblock %}
